<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Entgendern</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1d2421;
      --muted: #66706c;
      --line: #e3e7e5;
      --accent: #2f6f62;
      --track: #c9d0cd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1f1e;
        --fg: #e8ecea;
        --muted: #9aa5a0;
        --line: #2e3533;
        --accent: #5fb3a0;
        --track: #46504c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 290px;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 16px; font-weight: 650; }
    .count { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .row:last-child { border-bottom: 0; }
    .label small { display: block; color: var(--muted); font-size: 12px; word-break: break-all; }
    .switch { position: relative; flex: none; width: 36px; height: 20px; }
    .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .switch span {
      position: absolute; inset: 0; border-radius: 10px; background: var(--track);
      transition: background .15s;
    }
    .switch span::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
      border-radius: 50%; background: #fff; transition: transform .15s;
    }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(16px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .switch input:disabled + span { opacity: .4; }
  </style>
</head>
<body>
  <header>
    <h1>Entgendern</h1>
    <p class="count" id="count">&nbsp;</p>
  </header>
  <label class="row">
    <span class="label">Erweiterung aktiv</span>
    <span class="switch"><input type="checkbox" id="enabled"><span></span></span>
  </label>
  <label class="row">
    <span class="label">Auf dieser Website<small id="host"></small></span>
    <span class="switch"><input type="checkbox" id="site"><span></span></span>
  </label>
  <script src="popup.js"></script>
</body>
</html>
